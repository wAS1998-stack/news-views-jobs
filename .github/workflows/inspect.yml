name: Inspect Google index status
# On demand: what Google knows about a sample of our pages (indexed? crawled? JobPosting detected?).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = index status of sample pages; indexing-test = send 2 Indexing API pings and record Google's reply; notify = submit fresh sitemap + feed now"
        default: "inspect"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Inspect URLs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          case "${{ github.event.inputs.mode }}" in indexing-test) node tools-dev/test-indexing.js ;; notify) node notify-search.js ;; *) node tools-dev/inspect-urls.js ;; esac
      - name: Save result (no site build)
        run: |
          git config user.name "jobs-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/url-inspection.json data/indexing-test.json data/last-run.json 2>/dev/null; git diff --cached --quiet || { git commit -q -m "Index inspection [CF-Pages-Skip]" && git pull -q --rebase origin main && git push -q origin HEAD:main; } || true
