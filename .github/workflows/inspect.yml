name: Inspect Google index status
# On demand: what Google knows about a sample of our pages (indexed? crawled? JobPosting detected?).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = index status of sample pages; indexing-test = send 2 Indexing API pings and record Google's reply; notify = submit fresh sitemap + feed now; telegram = read the channel's public details; wayback = list the domain's old pages; relay = test whether the site's Cloudflare relay reaches the official websites; gsc = refresh data/gsc.json now (incl. brand-name searches)"
        default: "inspect"
      urls:
        description: "inspect mode only: comma-separated page URLs to check instead of the automatic sample"
        default: ""
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Inspect URLs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          URLS: ${{ github.event.inputs.urls }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.inputs.mode }}" in indexing-test) node tools-dev/test-indexing.js ;; notify) node notify-search.js ;; telegram) node tools-dev/telegram-info.js ;; wayback) node tools-dev/wayback.js ;; relay) node tools-dev/relay-test.js ;; gsc) GSC_FORCE=1 node gsc.js ;; *) node tools-dev/inspect-urls.js ;; esac
      - name: Save result (no site build)
        run: |
          git config user.name "jobs-bot"; git config user.email "actions@users.noreply.github.com"
          for f in data/url-inspection.json data/indexing-test.json data/last-run.json data/telegram.json data/old-urls.json data/relay-test.json data/gsc.json; do [ -f "$f" ] && git add "$f"; done; git diff --cached --quiet || { git commit -q -m "Index inspection [CF-Pages-Skip]" && git pull -q --rebase origin main && git push -q origin HEAD:main; } || true
