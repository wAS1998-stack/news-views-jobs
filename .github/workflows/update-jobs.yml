name: Update jobs

on:
  schedule:
    # Every 2 hours at :17 (off-peak minute; GitHub drops many on-the-hour runs).
    # 12 runs/day keeps site builds within Cloudflare Pages' free 500/month.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      enrich_links:
        description: "Max jobs to fix official links for this run"
        default: "25"
      enrich_updates:
        description: "Max results/admit-cards to enrich this run"
        default: "15"
      enrich_content:
        description: "Max job pages to write full content for this run"
        default: "5"
      max_new:
        description: "Max new jobs to add this run"
        default: "20"
      hindi:
        description: "Max jobs and updates to translate to Hindi this run"
        default: "25"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # a queued run must start from the LATEST data, not the commit that triggered it
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch new jobs & updates from feeds (AI fills details + finds official links)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOBS_FEEDS: ${{ secrets.JOBS_FEEDS }}
          MAX_NEW: ${{ github.event.inputs.max_new || '20' }}
          HAS_GOOGLE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
          HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        run: node fetch-jobs.js

      - name: Install PDF reader for official notices
        run: npm install --no-save --no-audit --no-fund pdf-parse@1.1.1 >/dev/null 2>&1 || echo "pdf-parse unavailable — PDFs read by title only"

      - name: Watch official websites (central + every state PSC / SSB / police board)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node watch.js

      - name: Search Console sync (sitemap submit + performance + opportunities, once a day)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node gsc.js

      - name: Enrich existing data (official links, rich update pages, full content)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH_LINKS: ${{ github.event.inputs.enrich_links || '25' }}
          ENRICH_UPDATES: ${{ github.event.inputs.enrich_updates || '15' }}
          HINDI_JOBS: ${{ github.event.inputs.hindi || '25' }}
          HINDI_UPDATES: ${{ github.event.inputs.hindi || '25' }}
          ENRICH_MAX: ${{ github.event.inputs.enrich_content || '5' }}
        run: node enrich-jobs.js

      - name: Write news & analysis (grounded in official sources)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-news.js

      - name: Daily freshness heartbeat (keeps the published date current)
        run: node heartbeat.js

      - name: Verify the site still builds before committing
        run: node build.js

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -q -m "Auto: new jobs, updates & news"
            git checkout -- . 2>/dev/null || true      # drop any stray non-data changes so rebase can run
            ok=false
            for i in 1 2 3 4; do
              git fetch -q origin main
              # Our run's data wins on a conflicting hunk (it is the newer work); other files rebase normally.
              if git rebase -X theirs origin/main; then
                # Never push data that no longer parses or no longer builds after an automatic merge.
                if ! node -e 'for (const f of require("fs").readdirSync("data").filter(f=>f.endsWith(".json"))) JSON.parse(require("fs").readFileSync("data/"+f,"utf8"))' || ! node build.js >/dev/null; then
                  echo "::error::Merged data is invalid — discarding this run's data to protect the site"; git reset -q --hard origin/main; break
                fi
                if git push -q origin HEAD:main; then ok=true; break; fi
              else
                git rebase --abort || true
              fi
              echo "Push attempt $i failed — retrying"; sleep $((i * 7))
            done
            if [ "$ok" != true ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::warning::Data not pushed this run (next run will redo the work)"; exit 0; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Pushed — Cloudflare will redeploy automatically."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          fi

      - name: Purge Cloudflare cache once the new build is live
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PURGE_SHA: ${{ steps.commit.outputs.sha }}
        run: node purge-cache.js

      - name: Notify Google (Indexing API — job pages only)
        if: steps.commit.outputs.changed == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node ping-google.js

      - name: Post new jobs to Telegram channel (instant traffic)
        if: steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-post.js

      - name: Notify IndexNow (Bing / Yandex — instant, no auth)
        if: steps.commit.outputs.changed == 'true'
        run: node indexnow.js

      - name: Save Telegram posted-history (so nothing is posted twice)
        if: steps.commit.outputs.changed == 'true'
        run: |
          git add data/posted.json
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -q -m "Auto: telegram posted-history [CF-Pages-Skip]"
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -X theirs origin/main && git push -q origin HEAD:main; then echo "Saved."; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          echo "::warning::Could not save posted-history this run"
