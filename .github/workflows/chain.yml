name: Keep updates flowing
# GitHub creates only ~4-6 of the scheduled "Update jobs" runs a day for this repo, however many cron slots there
# are, so each finished run starts the next one ~30 minutes later. The delay comes from the "pace-30m" environment's
# wait timer (Settings -> Environments), so no runner sits idle while waiting. Safety: if the wait timer is missing,
# the job sees that the last run started under 25 minutes ago and stops instead of looping; the cron slots in
# update-jobs.yml remain the backstop either way.
on:
  workflow_run:
    workflows: ["Update jobs"]
    types: [completed]
concurrency:
  group: chain
  cancel-in-progress: true     # one pending link at a time, so chains never multiply
permissions:
  actions: write
  contents: read
jobs:
  next:
    runs-on: ubuntu-latest
    environment: pace-30m
    steps:
      - name: Start the next update run, unless one started recently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/update-jobs.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at')
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          if [ "$age" -lt 1500 ]; then echo "Last run started ${age}s ago — not starting another (is the pace-30m wait timer set?)."; exit 0; fi
          gh workflow run update-jobs.yml --repo "${{ github.repository }}" --ref main && echo "Next update run started (previous one began ${age}s ago)."
