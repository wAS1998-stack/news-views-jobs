name: Purge Cloudflare cache after deploy

# Runs after any push to main made by a person (bot pushes from the
# "Update jobs" workflow purge in that workflow instead).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Wait for the Pages deploy, then purge news-views.in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PURGE_SHA: ${{ github.sha }}
        run: node purge-cache.js
