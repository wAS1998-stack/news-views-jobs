name: Diagnose official sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node tools-dev/diag-sources.js
      - run: |
          git config user.name "jobs-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/diag-sources.json && git commit -q -m "Diag: official sources [CF-Pages-Skip]" && git pull -q --rebase origin main && git push -q origin HEAD:main || true
